site:
  name: YOLEC Electric
  site: 'https://oemkitchenchina.xyz'
  base: '/'
  trailingSlash: false

  # Google Search Console Verification ID
  # Pega aquí el código que Google te da en Search Console > Configuración > Verificación de la propiedad
  # Ejemplo: googleSiteVerificationId: 'NxM4f9s7VexampleVALIDx9qLxJ4c'
  googleSiteVerificationId: false

# Default SEO Metadata
metadata:
  title:
    default: 'YOLEC Electric | Fabricante OEM de Electrodomésticos en China'
    template: '%s | YOLEC Electric'

  # Mantener < 160 caracteres para evitar truncamiento en SERPs
  description: 'Fabricante OEM y ODM de pequeños electrodomésticos en China desde 2015. CE, CB y RoHS para importadores y marcas privadas.'

  robots:
    index: true
    follow: true

  openGraph:
    site_name: YOLEC Electric
    # Formato locale exigido por Facebook: idioma_PAIS
    locale: es_ES
    images:
      - url: '~/assets/images/oem.png'
        width: 1200
        height: 630
        alt: 'YOLEC Electric - Fabricante OEM de pequeños electrodomésticos en China'
    type: website

  twitter:
    handle: '@yolec_electric'
    site: '@yolec_electric'
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 9

    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'categoria'
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 3

analytics:
  vendors:
    googleAnalytics:
      id: G-B3ESDFWKZ5

ui:
  theme: 'light'
